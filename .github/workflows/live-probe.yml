name: Live probe

# Measures a running server from outside: bots join, walk and watch each other, and the
# results (latency, snapshot timing, prediction corrections, bandwidth, server tick stats)
# are posted as annotations on the run. Start it from the Actions tab, or push a probe/* branch.
on:
  workflow_dispatch:
    inputs:
      url:
        description: WebSocket URL of the server
        default: wss://lanternwood-realms.onrender.com/ws
      bots:
        description: Number of bots
        default: '2'
      seconds:
        description: Seconds to measure
        default: '30'
      expect:
        description: Wait until /healthz contains this text (for example a deployed commit)
        default: '"protocol":2'
  push:
    branches: ['probe/**']

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url || 'wss://lanternwood-realms.onrender.com/ws' }}
      BOTS: ${{ inputs.bots || '2' }}
      SECONDS_TO_RUN: ${{ inputs.seconds || '30' }}
      EXPECT: ${{ inputs.expect || '"protocol":2' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Wake the server and wait for the expected version
        run: |
          HEALTH="$(echo "$URL" | sed -e 's#^ws#http#' -e 's#/ws/*$#/healthz#')"
          for i in $(seq 1 90); do
            BODY="$(curl -fsS -m 20 "$HEALTH" || true)"
            if [ -n "$BODY" ] && echo "$BODY" | grep -qF -- "$EXPECT"; then echo "$BODY"; exit 0; fi
            sleep 10
          done
          echo "::error::$HEALTH did not report $EXPECT within 15 minutes (last: $BODY)"
          exit 1
      - name: Probe
        run: npx tsx packages/server/scripts/net-probe.ts "$URL" --bots "$BOTS" --seconds "$SECONDS_TO_RUN" --annotate
      - name: Two real browsers on the live site
        run: |
          npx playwright install --with-deps chromium
          PAGE="$(echo "$URL" | sed -e 's#^ws#http#' -e 's#/ws/*$#/#')"
          node scripts/browser-smoke.mjs online "$PAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: screenshots/
          if-no-files-found: ignore
