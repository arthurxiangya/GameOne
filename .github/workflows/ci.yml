name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Switch to `npm ci` once package-lock.json is committed.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t lanternwood-realms:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name game -p 8080:8080 lanternwood-realms:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo
              curl -fsS -o /dev/null http://127.0.0.1:8080/ && echo "client served"
              exit 0
            fi
            sleep 1
          done
          docker logs game
          exit 1
